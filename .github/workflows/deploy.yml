# Manual deploy to Cloudflare Workers — the phone-tappable version of the
# README's `npm run deploy` flow (see README "Deploying").
#
# workflow_dispatch ONLY, on purpose: the README rules auto-deploy-on-push out
# of scope, and this workflow keeps that promise — nothing deploys until a
# human presses "Run workflow" (repo → Actions → Deploy), from whichever branch
# they picked in that dialog.
#
# Needs one repository secret: CLOUDFLARE_API_TOKEN (an "Edit Cloudflare
# Workers" template token). CLOUDFLARE_ACCOUNT_ID is only needed if that token
# can see more than one Cloudflare account — with a single account, wrangler
# infers it, and an unset secret resolves to an empty string wrangler ignores.
name: Deploy

on:
  workflow_dispatch:

concurrency:
  # One deploy at a time, and never cancel a running upload — a second tap
  # queues behind the first instead of racing it.
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Test
        run: npm test
        env:
          # The Garmin-fixture suites assert the activity's name, which Garmin
          # derives from LOCAL time of day ("Night Run" vs "Morning Run") — on
          # a UTC runner two of them fail for the timezone, not the code.
          TZ: Europe/Copenhagen

      - name: Lint
        run: npm run lint

      # `npm run deploy` == `npm run build && wrangler deploy` — the exact
      # command the README's manual flow runs, so CI and a laptop deploy can
      # never drift apart.
      - name: Deploy
        run: npm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
